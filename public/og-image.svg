<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative blob (top right) -->
  <g transform="translate(970, 200)">
    <circle r="160" fill="url(#blob)" opacity="0.85"/>
    <circle r="160" fill="none" stroke="#fde68a" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="200" fill="none" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1"/>
    <circle r="240" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- Top status pill -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(251,191,36,0.10)" stroke="rgba(251,191,36,0.25)"/>
    <circle cx="20" cy="17" r="4" fill="#fbbf24"/>
    <text x="36" y="22" fill="#fde68a" font-family="Inter, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5">
      open to ML / AI roles
    </text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="200" fill="#a1a1aa" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" letter-spacing="3" text-transform="uppercase">
    DATA SCIENTIST · 5C NETWORK · BENGALURU
  </text>

  <!-- Big name -->
  <text x="80" y="340" fill="#ffffff" font-family="Inter, sans-serif" font-size="144" font-weight="500" letter-spacing="-6">
    Abhijay S<tspan fill="url(#accent)">.</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="420" fill="#d4d4d8" font-family="Inter, sans-serif" font-size="34" font-weight="500" letter-spacing="-1">
    Building <tspan fill="url(#accent)">vision</tspan> and <tspan fill="url(#accent)">LLM</tspan> systems for radiology.
  </text>

  <!-- Stat row -->
  <g transform="translate(80, 510)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#fbbf24" font-family="Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-2">~60%</text>
      <text x="0" y="32" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="14">automated reads</text>
    </g>
    <g transform="translate(220, 0)">
      <text x="0" y="0" fill="#ffffff" font-family="Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-2">755k+</text>
      <text x="0" y="32" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="14">validation studies</text>
    </g>
    <g transform="translate(460, 0)">
      <text x="0" y="0" fill="#ffffff" font-family="Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-2">30+</text>
      <text x="0" y="32" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="14">production pathologies</text>
    </g>
    <g transform="translate(680, 0)">
      <text x="0" y="0" fill="#ffffff" font-family="Inter, sans-serif" font-size="48" font-weight="500" letter-spacing="-2">13</text>
      <text x="0" y="32" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="14">projects shipped</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="80" y="600" fill="#71717a" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="2">
    abhijays.me  ·  abhijay@5cnetwork.com
  </text>
</svg>
